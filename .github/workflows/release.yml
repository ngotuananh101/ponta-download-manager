# Release workflow for Ponta Download Manager.
#
# Triggers:
#   - push tag v*      -> test + build + create a GitHub Release with 7 files
#   - workflow_dispatch -> test + build only; artifacts stay on the run
#
# Artifacts (version from apps/desktop/pubspec.yaml, e.g. 0.1.0):
#   Windows: pdm-<v>-windows-x64-setup.exe (Inno Setup)
#            pdm-<v>-windows-x64.msi (WiX v4)
#            pdm-<v>-windows-x64-portable.zip
#   Linux:   pdm-<v>-linux-x64.deb, pdm-<v>-linux-x64.rpm (fpm)
#            pdm-<v>-linux-x64.AppImage (linuxdeploy + appimagetool)
#            pdm-<v>-linux-x64-portable.tar.gz
#
# The installers are UNSIGNED (no code signing certificate yet):
# Windows shows a SmartScreen warning on first run. This is stated
# in the README and in the release body below.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Desktop tests
        working-directory: apps/desktop
        run: |
          flutter test
          flutter analyze

      - name: Dart packages
        run: |
          for dir in apps/engine packages/* integrations/browser-extension/host; do
            echo "=== $dir ==="
            (cd "$dir" && dart test && dart analyze)
          done

      - name: Extension tests
        working-directory: integrations/browser-extension/extension
        run: node --test

      - name: Tools tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/ -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Read version
        id: version
        shell: bash
        run: python packaging/read_version.py >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Fetch external tools
        shell: bash
        run: bash tools/fetch_external_tools.sh windows

      # The browser extension's native messaging host. CMake copies
      # bundle/bin into <bundle>/bin, which is where the app looks for
      # pdm-native-host.exe when it registers the host with each browser.
      - name: Build native messaging host
        shell: bash
        run: bash tools/build_native_host.sh windows

      - name: Build Windows
        working-directory: apps/desktop
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build EXE installer
        shell: pwsh
        run: iscc packaging/windows/pdm.iss /DAppVersion="${{ steps.version.outputs.version }}" /DSourceDir="$PWD\apps\desktop\build\windows\x64\runner\Release"

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Build MSI
        shell: pwsh
        run: |
          python packaging/windows/generate_wix_files.py
          # WiX v7 gates builds behind the OSMF EULA (error WIX7015);
          # -acceptEula wix7 is the documented non-interactive CI
          # acceptance (no fee below $10,000/year revenue).
          wix build packaging/windows/pdm.wxs packaging/windows/Files.wxs -d ProductVersion="${{ steps.version.outputs.msi_version }}" -d SourceDir="$PWD\apps\desktop\build\windows\x64\runner\Release" -o "dist\pdm-${{ steps.version.outputs.version }}-windows-x64.msi" -acceptEula wix7

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'apps\desktop\build\windows\x64\runner\Release\*' -DestinationPath "dist\pdm-${{ steps.version.outputs.version }}-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          path: dist/pdm-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-windows-x64.msi
          path: dist/pdm-${{ steps.version.outputs.version }}-windows-x64.msi
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-windows-x64-portable.zip
          path: dist/pdm-${{ steps.version.outputs.version }}-windows-x64-portable.zip
          if-no-files-found: error

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Read version
        id: version
        shell: bash
        run: python3 packaging/read_version.py >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # dpkg-dev and file are required by the linuxdeploy gtk plugin
          # (dpkg-architecture to find the multiarch libdir, file to
          # classify ELF vs script). They are not pulled in by
          # libgtk-3-dev.
          #
          # librsvg2-common is what actually creates
          # /usr/lib/<triplet>/gdk-pixbuf-2.0/2.10.0/ (it drops the SVG
          # pixbuf loader in there). On Ubuntu 26.04 that directory is
          # not shipped by any package libgtk-3-dev pulls in, and the
          # runner has recommends disabled, so the gtk plugin dies with
          # `cp: cannot stat 'gdk-pixbuf-2.0/2.10.0'` right after
          # "Installing GDK PixBufs". The app also needs it at runtime
          # to render SVG icons.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev file librsvg2-common ruby ruby-dev
          sudo gem install fpm

      - name: Get dependencies
        run: flutter pub get

      - name: Fetch external tools
        run: bash tools/fetch_external_tools.sh linux

      # The browser extension's native messaging host. CMake copies
      # bundle/bin into <bundle>/bin, which is where the app looks for
      # pdm-native-host when it registers the host with each browser.
      - name: Build native messaging host
        run: bash tools/build_native_host.sh linux

      - name: Build Linux
        working-directory: apps/desktop
        run: flutter build linux --release

      - name: Build DEB and RPM
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist staging/opt/pdm staging/usr/share/applications staging/usr/share/icons/hicolor/512x512/apps
          cp -a apps/desktop/build/linux/x64/release/bundle/. staging/opt/pdm/
          cp packaging/linux/com.ponta.pdm.desktop staging/usr/share/applications/
          cp apps/desktop/assets/images/icon.png staging/usr/share/icons/hicolor/512x512/apps/com.ponta.pdm.png
          fpm -s dir -t deb -n pdm -v "$V" --description "Ponta Download Manager" --url "https://github.com/ngotuananh101/ponta-download-manager" -d libgtk-3-0 --after-install packaging/linux/after-install.sh --before-remove packaging/linux/before-remove.sh -C staging -p "dist/pdm-$V-linux-x64.deb" opt usr
          fpm -s dir -t rpm -n pdm -v "$V" --description "Ponta Download Manager" --url "https://github.com/ngotuananh101/ponta-download-manager" -d gtk3 --after-install packaging/linux/after-install.sh --before-remove packaging/linux/before-remove.sh -C staging -p "dist/pdm-$V-linux-x64.rpm" opt usr

      - name: Build AppImage
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          # Keep the Flutter bundle layout under AppDir/usr so the
          # binary's $ORIGIN/lib RPATH still finds libflutter: the
          # binary lives at usr/pdm, its libs at usr/lib. The .desktop
          # Exec=pdm needs a usr/bin entry, so link it.
          mkdir -p AppDir/usr AppDir/usr/bin
          cp -a apps/desktop/build/linux/x64/release/bundle/. AppDir/usr/
          ln -s ../pdm AppDir/usr/bin/pdm
          cp packaging/linux/com.ponta.pdm.desktop AppDir/com.ponta.pdm.desktop
          cp apps/desktop/assets/images/icon.png AppDir/com.ponta.pdm.png
          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/pdm" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          # linuxdeploy + appimagetool are AppImages themselves; extract
          # them so no FUSE is needed on the runner. The gtk plugin is
          # NOT published as an AppImage any more (the continuous asset
          # 404s) — upstream ships it as a shell script instead, pinned
          # to a commit so the build is reproducible.
          curl -fL -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL -o linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/3b67a1d1c1b0c8268f57f2bce40fe2d33d409cea/linuxdeploy-plugin-gtk.sh
          curl -fL -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh appimagetool-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-root
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-root
          export PATH="$PWD/appimagetool-root/usr/bin:$PATH"
          export DEPLOY_GTK_VERSION=3
          # linuxdeploy resolves plugins by *name*, not by path: it
          # scans $PATH plus the working directory for files matching
          # ^linuxdeploy-plugin-<name>, then looks the name up in a map.
          # Passing a path (e.g. ./linuxdeploy-plugin-gtk.sh) can never
          # match and fails with "Could not find plugin".
          ./linuxdeploy-root/AppRun --appdir AppDir --plugin gtk --output appimage
          rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh appimagetool-x86_64.AppImage
          mkdir -p dist
          ls -la ./*.AppImage
          mv ./*.AppImage "dist/pdm-$V-linux-x64.AppImage"

      - name: Build portable tarball
        run: |
          tar -czf "dist/pdm-${{ steps.version.outputs.version }}-linux-x64-portable.tar.gz" -C apps/desktop/build/linux/x64/release bundle

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-linux-x64.deb
          path: dist/pdm-${{ steps.version.outputs.version }}-linux-x64.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-linux-x64.rpm
          path: dist/pdm-${{ steps.version.outputs.version }}-linux-x64.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-linux-x64.AppImage
          path: dist/pdm-${{ steps.version.outputs.version }}-linux-x64.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-linux-x64-portable.tar.gz
          path: dist/pdm-${{ steps.version.outputs.version }}-linux-x64-portable.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pdm-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Unsigned build: Windows will show a SmartScreen warning on first run (no code signing certificate yet).
