# Release workflow for Ponta Download Manager.
#
# Triggers:
#   - push tag v*      -> test + build + create a GitHub Release with 7 files
#   - workflow_dispatch -> test + build only; artifacts stay on the run
#
# Artifacts (version from apps/desktop/pubspec.yaml, e.g. 0.1.0):
#   Windows: pdm-<v>-windows-x64-setup.exe (Inno Setup)
#            pdm-<v>-windows-x64.msi (WiX v4)
#            pdm-<v>-windows-x64-portable.zip
#   Linux:   pdm-<v>-linux-x64.deb, pdm-<v>-linux-x64.rpm (fpm)
#            pdm-<v>-linux-x64.AppImage (linuxdeploy + appimagetool)
#            pdm-<v>-linux-x64-portable.tar.gz
#
# The installers are UNSIGNED (no code signing certificate yet):
# Windows shows a SmartScreen warning on first run. This is stated
# in the README and in the release body below.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Desktop tests
        working-directory: apps/desktop
        run: |
          flutter test
          flutter analyze

      - name: Dart packages
        run: |
          for dir in apps/engine packages/* integrations/browser-extension/host; do
            echo "=== $dir ==="
            (cd "$dir" && dart test && dart analyze)
          done

      - name: Extension tests
        working-directory: integrations/browser-extension/extension
        run: node --test

      - name: Tools tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/ -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Read version
        id: version
        shell: bash
        run: python packaging/read_version.py >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        working-directory: apps/desktop
        run: flutter build windows --release

      - name: Fetch external tools
        shell: bash
        run: bash tools/fetch_external_tools.sh windows

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build EXE installer
        shell: pwsh
        run: iscc packaging/windows/pdm.iss /DAppVersion="${{ steps.version.outputs.version }}" /DSourceDir="$PWD\build\windows\x64\runner\Release"

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Build MSI
        shell: pwsh
        run: |
          python packaging/windows/generate_wix_files.py
          wix build packaging/windows/pdm.wxs packaging/windows/Files.wxs -d ProductVersion="${{ steps.version.outputs.msi_version }}" -d SourceDir="$PWD\build\windows\x64\runner\Release" -o "dist\pdm-${{ steps.version.outputs.version }}-windows-x64.msi"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath "dist\pdm-${{ steps.version.outputs.version }}-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          path: dist/pdm-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-windows-x64.msi
          path: dist/pdm-${{ steps.version.outputs.version }}-windows-x64.msi
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-windows-x64-portable.zip
          path: dist/pdm-${{ steps.version.outputs.version }}-windows-x64-portable.zip
          if-no-files-found: error

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Read version
        id: version
        shell: bash
        run: python3 packaging/read_version.py >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ruby ruby-dev
          sudo gem install fpm

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        working-directory: apps/desktop
        run: flutter build linux --release

      - name: Fetch external tools
        run: bash tools/fetch_external_tools.sh linux

      - name: Build DEB and RPM
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist staging/opt/pdm staging/usr/share/applications staging/usr/share/icons/hicolor/512x512/apps
          cp -a apps/desktop/build/linux/x64/release/bundle/. staging/opt/pdm/
          cp packaging/linux/com.ponta.pdm.desktop staging/usr/share/applications/
          cp apps/desktop/assets/images/icon.png staging/usr/share/icons/hicolor/512x512/apps/com.ponta.pdm.png
          fpm -s dir -t deb -n pdm -v "$V" --description "Ponta Download Manager" --url "https://github.com/ngotuananh101/ponta-download-manager" -d libgtk-3-0 --after-install packaging/linux/after-install.sh --before-remove packaging/linux/before-remove.sh -C staging -p "dist/pdm-$V-linux-x64.deb" opt usr
          fpm -s dir -t rpm -n pdm -v "$V" --description "Ponta Download Manager" --url "https://github.com/ngotuananh101/ponta-download-manager" -d gtk3 --after-install packaging/linux/after-install.sh --before-remove packaging/linux/before-remove.sh -C staging -p "dist/pdm-$V-linux-x64.rpm" opt usr

      - name: Build AppImage
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          # Keep the Flutter bundle layout under AppDir/usr so the
          # binary's $ORIGIN/lib RPATH still finds libflutter: the
          # binary lives at usr/pdm, its libs at usr/lib. The .desktop
          # Exec=pdm needs a usr/bin entry, so link it.
          mkdir -p AppDir/usr
          cp -a apps/desktop/build/linux/x64/release/bundle/. AppDir/usr/
          ln -s ../pdm AppDir/usr/bin/pdm
          cp packaging/linux/com.ponta.pdm.desktop AppDir/com.ponta.pdm.desktop
          cp apps/desktop/assets/images/icon.png AppDir/com.ponta.pdm.png
          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/pdm" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          # linuxdeploy + gtk plugin + appimagetool are AppImages
          # themselves; extract them so no FUSE is needed on the runner.
          curl -L -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-gtk-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage
          curl -L -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk-x86_64.AppImage appimagetool-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-root
          ./linuxdeploy-plugin-gtk-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-plugin-gtk-root
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-root
          export PATH="$PWD/linuxdeploy-plugin-gtk-root/usr/bin:$PWD/appimagetool-root/usr/bin:$PATH"
          ./linuxdeploy-root/AppRun --appdir AppDir --plugin gtk --output appimage
          rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk-x86_64.AppImage appimagetool-x86_64.AppImage
          mkdir -p dist
          ls -la ./*.AppImage
          mv ./*.AppImage "dist/pdm-$V-linux-x64.AppImage"

      - name: Build portable tarball
        run: |
          tar -czf "dist/pdm-${{ steps.version.outputs.version }}-linux-x64-portable.tar.gz" -C apps/desktop/build/linux/x64/release bundle

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-linux-x64.deb
          path: dist/pdm-${{ steps.version.outputs.version }}-linux-x64.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-linux-x64.rpm
          path: dist/pdm-${{ steps.version.outputs.version }}-linux-x64.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-linux-x64.AppImage
          path: dist/pdm-${{ steps.version.outputs.version }}-linux-x64.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pdm-${{ steps.version.outputs.version }}-linux-x64-portable.tar.gz
          path: dist/pdm-${{ steps.version.outputs.version }}-linux-x64-portable.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pdm-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Unsigned build: Windows will show a SmartScreen warning on first run (no code signing certificate yet).
