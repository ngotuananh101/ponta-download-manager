<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDM</title>
<style>
  :root { color-scheme: dark; }
  body { width: 360px; margin: 0; font: 12px/1.33 system-ui, sans-serif; color: #f2f2f2; background: #121212; }
  header { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-bottom: 1px solid #333; }
  header img { width: 16px; height: 16px; flex-shrink: 0; }
  header h1 { font-size: 12px; font-weight: 600; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9a9a9a; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch { flex-shrink: 0; width: 28px; height: 16px; border-radius: 9999px; background: #2a2a2a; border: 1px solid #555; position: relative; transition: background 0.15s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #9a9a9a; transition: left 0.15s, background 0.15s; }
  .toggle input:checked + .switch { background: #73cefc; border-color: #73cefc; }
  .toggle input:checked + .switch::after { left: 14px; background: #141415; }
  .toggle input:focus-visible + .switch { outline: 2px solid #73cefc; outline-offset: 2px; }
  #probe { border-bottom: 1px solid #333; padding: 8px 12px; }
  #probe-status { margin: 0; color: #9a9a9a; font-size: 12px; }
  #probe-status.error { color: #ff6b6b; }
  #probe-title { margin: 0 0 6px; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #probe-formats { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
  #probe-formats li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #333; }
  #probe-formats li:last-child { border-bottom: none; }
  #probe-formats .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; }
  #list li { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 12px; border-bottom: 1px solid #333; }
  #list li:last-child { border-bottom: none; }
  #list .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .badge { flex-shrink: 0; font-size: 12px; font-weight: 500; border-radius: 9999px; padding: 1px 6px; background: #232323; border: 1px solid #333; }
  #list .badge.video { color: #73cefc; }
  #list .badge.audio { color: #4ec284; }
  button { flex-shrink: 0; height: 32px; padding: 0 12px; font: 600 12px/1 system-ui, sans-serif; color: #141415; background: #73cefc; border: none; border-radius: 8px; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  button:disabled { background: #2a2a2a; color: #9a9a9a; cursor: default; }
  button:focus-visible { outline: 2px solid #73cefc; outline-offset: 2px; }
  #empty { padding: 16px 12px; color: #9a9a9a; text-align: center; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<header>
  <img src="icons/icon16.png" alt="" width="16" height="16">
  <h1>Ponta Download Manager</h1>
  <label class="toggle"><input type="checkbox" id="intercept"><span class="switch"></span> Intercept downloads</label>
</header>
<section id="probe">
  <p id="probe-status" hidden></p>
  <h2 id="probe-title" hidden></h2>
  <ul id="probe-formats" hidden></ul>
</section>
<ul id="list"></ul>
<p id="empty" hidden>No video or audio found on this page.</p>
<script src="popup_probe.js"></script>
<script src="popup.js"></script>
</body>
</html>
