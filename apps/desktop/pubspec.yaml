name: pdm
description: "Ponta Download Manager — desktop UI (Flutter + Riverpod clean architecture)."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^3.0.0
  fpdart: ^1.2.0
  uuid: ^4.6.0
  logging: ^1.3.0
  path: ^1.9.1
  download_api:
    path: ../../packages/download_api
  download_ipc:
    path: ../../packages/download_ipc
  download_external:
    path: ../../packages/download_external
  pdm_engine:
    path: ../../apps/engine
  window_manager: ^0.7.0
  # nativeapi (windowing, tray) comes in through window_manager; the app
  # names it directly for the tray/window types.
  nativeapi: ^0.6.0
  nativeapi_flutter: ^0.6.0
  # file_picker 13 ships federated platform implementations. desktop_drop is
  # not used: it pins cross_file ^0.4.0 while file_picker 13 needs
  # ^0.3.5+4, so drag-and-drop is done by the platform runners instead
  # (linux/runner/drop_target.cc, windows/runner/drop_target.cpp).
  file_picker: ^13.3.3
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  fake_async: ^1.3.3
  riverpod_lint: ^3.2.0

  mocktail: ^1.0.5
  # browser_integration_service_test derives the Chrome extension id from the
  # pinned public key, the same way Chromium does.
  crypto: ^3.0.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.png
    - assets/images/icon.ico
