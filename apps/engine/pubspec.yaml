name: pdm_engine
description: "Standalone Dart download engine (CLI / daemon). No Flutter dependency."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  args: ^2.7.0
  download_api:
    path: ../../packages/download_api
  download_ipc:
    path: ../../packages/download_ipc
  download_core:
    path: ../../packages/download_core
  download_integrity:
    path: ../../packages/download_integrity
  download_external:
    path: ../../packages/download_external
  download_limiter:
    path: ../../packages/download_limiter
  download_recovery:
    path: ../../packages/download_recovery
  download_scheduler:
    path: ../../packages/download_scheduler
  download_storage:
    path: ../../packages/download_storage
  download_transport:
    path: ../../packages/download_transport
  logging: ^1.3.0
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.31.1
