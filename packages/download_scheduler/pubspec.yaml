name: download_scheduler
description: "Global scheduling for the download engine: priority queue, concurrent downloads, pause/resume/cancel."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  download_api:
    path: ../download_api
  download_core:
    path: ../download_core
  download_limiter:
    path: ../download_limiter
  download_storage:
    path: ../download_storage
  download_transport:
    path: ../download_transport
  logging: ^1.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  path: ^1.9.0
  test: ^1.31.1
